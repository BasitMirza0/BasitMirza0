<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07131f"/>
      <stop offset="55%" stop-color="#0b2239"/>
      <stop offset="100%" stop-color="#063b36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#54c5f8"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#41d19c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <circle cx="1050" cy="20" r="150" fill="#19c9a2" opacity=".10"/>
  <circle cx="1120" cy="270" r="170" fill="#38bdf8" opacity=".08"/>
  <circle cx="80" cy="290" r="150" fill="#38bdf8" opacity=".06"/>
  <ellipse cx="920" cy="155" rx="190" ry="70" fill="#22d3ee" opacity=".06" filter="url(#glow)"/>

  <text x="70" y="95" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700">Basit Mirza</text>
  <rect x="70" y="118" width="360" height="5" rx="3" fill="url(#accent)"/>
  <text x="70" y="170" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="500">Flutter Developer  •  AI/ML  •  Computer Vision</text>
  <text x="70" y="212" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Building intelligent mobile products with Flutter, Firebase, FastAPI &amp; practical AI.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">
    <rect x="70" y="242" width="106" height="36" rx="18" fill="#0ea5e9" opacity=".18" stroke="#38bdf8" stroke-opacity=".55"/>
    <text x="123" y="265" fill="#bae6fd" text-anchor="middle">Flutter</text>

    <rect x="188" y="242" width="98" height="36" rx="18" fill="#16a34a" opacity=".15" stroke="#4ade80" stroke-opacity=".45"/>
    <text x="237" y="265" fill="#bbf7d0" text-anchor="middle">Firebase</text>

    <rect x="298" y="242" width="102" height="36" rx="18" fill="#14b8a6" opacity=".16" stroke="#2dd4bf" stroke-opacity=".50"/>
    <text x="349" y="265" fill="#99f6e4" text-anchor="middle">FastAPI</text>

    <rect x="412" y="242" width="92" height="36" rx="18" fill="#7c3aed" opacity=".15" stroke="#a78bfa" stroke-opacity=".50"/>
    <text x="458" y="265" fill="#ddd6fe" text-anchor="middle">YOLO</text>
  </g>

  <g transform="translate(900 80)">
    <rect width="220" height="126" rx="22" fill="#ffffff" opacity=".035" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="110" y="48" fill="#67e8f9" font-family="monospace" font-size="17" text-anchor="middle">&lt; mobile + AI /&gt;</text>
    <text x="110" y="82" fill="#d1fae5" font-family="monospace" font-size="16" text-anchor="middle">build • test • ship</text>
  </g>
</svg>